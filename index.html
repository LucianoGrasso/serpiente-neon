<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Serpiente Neón</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --grid: #1c232d;
    --text: #e6edf3;
    --muted: #8b949e;
    --snake: #3fb950;
    --head: #7ee787;
    --food: #ff7b72;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    touch-action: none;
    user-select: none;
  }
  .wrap { width: min(480px, 100%); }
  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  h1 { font-size: 1.4rem; margin: 0; letter-spacing: .02em; }
  .scores { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
  .scores span { color: var(--muted); font-size: .85rem; }
  .scores b { font-size: 1.1rem; margin-left: 4px; }
  .board {
    position: relative;
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 0 1px #30363d, 0 10px 40px rgba(0,0,0,.4);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(13,17,23,.82);
    text-align: center;
    padding: 24px;
    transition: opacity .2s ease;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay h2 { margin: 0; font-size: 1.6rem; }
  .overlay p { margin: 0; color: var(--muted); line-height: 1.5; }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--accent);
    color: #0d1117;
    border: 0;
    border-radius: 8px;
    padding: 10px 22px;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
  footer { margin-top: 12px; color: var(--muted); font-size: .8rem; text-align: center; }
  .ranking {
    margin-top: 16px;
    background: var(--panel);
    border-radius: 12px;
    padding: 14px 18px;
    box-shadow: 0 0 0 1px #30363d;
  }
  .ranking h3 { margin: 0 0 8px; font-size: 1rem; }
  .ranking ol { margin: 0; padding-left: 1.6em; font-variant-numeric: tabular-nums; }
  .ranking li { padding: 3px 0; }
  .ranking li b { float: right; }
  #enviar { display: flex; gap: 8px; }
  #enviar[hidden] { display: none; }
  #nombre {
    font: inherit;
    width: 10em;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1px solid #30363d;
    background: var(--bg);
    color: var(--text);
    user-select: text;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐍 Serpiente Neón</h1>
    <div class="scores">
      <span>Puntos<b id="score">0</b></span>
      <span>Récord<b id="best">0</b></span>
    </div>
  </header>
  <div class="board">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="title">Serpiente Neón</h2>
      <p id="msg">Come las manzanas y no choques.<br>Flechas / WASD o desliza el dedo.</p>
      <form id="enviar" hidden>
        <input id="nombre" maxlength="12" placeholder="Tu nombre" autocomplete="nickname">
        <button type="submit">Guardar</button>
      </form>
      <button id="start">Jugar</button>
    </div>
  </div>
  <section class="ranking">
    <h3>🏆 Ranking global</h3>
    <ol id="ranking"><li>Cargando…</li></ol>
  </section>
  <footer>Espacio o P para pausar · Desplegado en AWS (S3 + CloudFront)</footer>
</div>
<script>
(() => {
  const N = 20;                       // celdas por lado
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const C = canvas.width / N;         // tamaño de celda en px
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), titleEl = $('title'), msgEl = $('msg'), startBtn = $('start');

  const API = 'https://48923ue0q0.execute-api.us-east-2.amazonaws.com/puntuaciones';
  const form = $('enviar'), nombreEl = $('nombre'), rankingEl = $('ranking');

  function fila(texto, puntos) {
    const li = document.createElement('li');
    li.textContent = texto;               // textContent, nunca innerHTML: el nombre viene de otros jugadores
    if (puntos !== undefined) {
      const b = document.createElement('b');
      b.textContent = puntos;
      li.append(b);
    }
    return li;
  }

  async function cargarRanking() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      const lista = await res.json();
      rankingEl.replaceChildren(...(lista.length
        ? lista.map(p => fila(p.nombre, p.puntos))
        : [fila('Todavía no hay puntuaciones')]));
    } catch {
      rankingEl.replaceChildren(fila('No se pudo cargar el ranking'));
    }
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const nombre = nombreEl.value.trim();
    if (!nombre) return;
    const boton = form.querySelector('button');
    boton.disabled = true;
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({nombre, puntos: score}),
      });
      const datos = await res.json();
      if (!res.ok) throw new Error(datos.error || 'Error ' + res.status);
      try { localStorage.setItem('snake-nombre', nombre); } catch {}
      form.hidden = true;
      msgEl.textContent = '¡Guardado en el ranking!';
      cargarRanking();
    } catch (err) {
      msgEl.textContent = 'No se pudo guardar: ' + err.message;
    } finally {
      boton.disabled = false;
    }
  });

  let best = 0;
  try { best = +localStorage.getItem('snake-best') || 0; } catch {}
  $('best').textContent = best;

  let snake, dir, queue, food, score, speed, running, paused, last, acc;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    queue = [];
    score = 0;
    speed = 8;                        // pasos por segundo
    $('score').textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function turn(x, y) {
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (x === -ref.x && y === -ref.y) return;   // no se puede dar media vuelta
    if (x === ref.x && y === ref.y) return;
    if (queue.length < 3) queue.push({x, y});
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    const eating = head.x === food.x && head.y === food.y;
    const body = eating ? snake : snake.slice(0, -1);
    if (hitWall || body.some(s => s.x === head.x && s.y === head.y)) return gameOver();
    snake.unshift(head);
    if (eating) {
      score++;
      $('score').textContent = score;
      speed = Math.min(20, 8 + score * 0.4);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = '#161b22';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1c232d';
    for (let i = 0; i < N; i++)
      for (let j = 0; j < N; j++)
        if ((i + j) % 2) ctx.fillRect(i * C, j * C, C, C);

    // comida
    ctx.shadowColor = '#ff7b72';
    ctx.shadowBlur = 16;
    ctx.fillStyle = '#ff7b72';
    ctx.beginPath();
    ctx.arc(food.x * C + C / 2, food.y * C + C / 2, C * 0.38, 0, Math.PI * 2);
    ctx.fill();

    // serpiente
    ctx.shadowColor = '#3fb950';
    snake.forEach((s, i) => {
      ctx.shadowBlur = i === 0 ? 18 : 8;
      ctx.fillStyle = i === 0 ? '#7ee787' : '#3fb950';
      const p = 2;
      ctx.beginPath();
      ctx.roundRect(s.x * C + p, s.y * C + p, C - p * 2, C - p * 2, 6);
      ctx.fill();
    });
    ctx.shadowBlur = 0;
  }

  function loop(t) {
    if (!running) return;
    if (!paused) {
      acc += (t - last) / 1000;
      const dt = 1 / speed;
      while (acc >= dt && running) { step(); acc -= dt; }
      draw();
    }
    last = t;
    requestAnimationFrame(loop);
  }

  function start() {
    reset();
    form.hidden = true;
    running = true;
    paused = false;
    overlay.classList.add('hidden');
    last = performance.now();
    acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      try { localStorage.setItem('snake-best', best); } catch {}
      $('best').textContent = best;
      titleEl.textContent = '¡Nuevo récord!';
    } else {
      titleEl.textContent = 'Fin del juego';
    }
    msgEl.innerHTML = `Hiciste <b>${score}</b> punto${score === 1 ? '' : 's'}.`;
    form.hidden = score === 0;
    try { nombreEl.value = localStorage.getItem('snake-nombre') || ''; } catch {}
    startBtn.textContent = 'Jugar otra vez';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    titleEl.textContent = 'Pausa';
    msgEl.textContent = 'Pulsa espacio para seguir.';
    startBtn.textContent = 'Seguir';
    overlay.classList.toggle('hidden', !paused);
  }

  startBtn.addEventListener('click', () => paused ? togglePause() : start());

  const keys = {
    ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
    ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
    ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  };
  document.addEventListener('keydown', e => {
    if (e.target === nombreEl) return;
    if (keys[e.key]) {
      e.preventDefault();
      if (!running) return start();
      if (!paused) turn(...keys[e.key]);
    } else if (e.key === ' ' || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      if (!running) start(); else togglePause();
    } else if (e.key === 'Enter' && !running) {
      start();
    }
  });

  let touch = null;
  canvas.addEventListener('touchstart', e => { touch = e.touches[0]; }, {passive: true});
  canvas.addEventListener('touchend', e => {
    if (!touch || !running || paused) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.clientX, dy = t.clientY - touch.clientY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(Math.sign(dx), 0);
    else turn(0, Math.sign(dy));
    touch = null;
  });

  reset();
  draw();
  cargarRanking();
})();
</script>
</body>
</html>
